name: Specification QA

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/specification-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/specification_qa.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
